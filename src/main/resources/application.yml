spring:
  application:
    name: be-interview-prep2
  datasource:
    # Local defaults match the README's docker command; override via environment variables.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prep}
    username: ${SPRING_DATASOURCE_USERNAME:prep}
    password: ${SPRING_DATASOURCE_PASSWORD:prep}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  booking:
    slot-length: 30m
    hold-duration: 5m
    # Clinic hours in the business zone (ClockConfig). Quoted: YAML would read 09:00 as a number.
    day-start: "09:00"
    day-end: "17:00"
    # Housekeeping only: availability and holds treat overdue holds as expired without it.
    expiry-sweep:
      enabled: true
      interval: 1m
