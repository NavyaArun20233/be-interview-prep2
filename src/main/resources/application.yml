spring:
  application:
    name: be-interview-prep2
  datasource:
    # Local defaults match the README's docker command; override via environment variables.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prep}
    username: ${SPRING_DATASOURCE_USERNAME:prep}
    password: ${SPRING_DATASOURCE_PASSWORD:prep}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  # Per-API-key quota for /api/v1/quotes/** (env APP_RATELIMIT_LIMIT / APP_RATELIMIT_WINDOW).
  rate-limit:
    limit: 10
    window: 1m
  booking:
    slot-length: 30m
    hold-duration: 5m
    # Clinic hours in the business zone (ClockConfig). Quoted: YAML would read 09:00 as a number.
    day-start: "09:00"
    day-end: "17:00"
    # Housekeeping only: availability and holds treat overdue holds as expired without it.
    expiry-sweep:
      enabled: true
      interval: 1m

---
# File uploads (/api/v1/files). A separate YAML document so this block stays self-contained.
app:
  storage:
    location: ${APP_STORAGE_LOCATION:uploads}
    max-file-size: 5MB
spring:
  servlet:
    multipart:
      # Rejects oversized uploads while parsing (413) instead of buffering them; the service re-checks the limit.
      max-file-size: ${app.storage.max-file-size}
      # Room for one file plus multipart framing; raise together with app.storage.max-file-size.
      max-request-size: 6MB
